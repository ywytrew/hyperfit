name: scientific-regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: python tools/build_manuals.py && git diff --exit-code -- hyperfit/frontend
      - run: python -m hyperfit.verify --output validation-results/fem-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: fem-verification
          path: validation-results/fem-verification.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8765/api/models
          curl --fail http://127.0.0.1:8765/locales/ja.json
          curl --fail http://127.0.0.1:8765/manual-en.html
          docker compose exec -T hyperfit python -c "import os; from pathlib import Path; p=Path(os.environ['HYPERFIT_RUNS'])/'ci-write-check'; p.write_text('ok'); assert p.read_text() == 'ok'; p.unlink()"
      - if: always()
        run: docker compose logs --tail=100 && docker compose down
