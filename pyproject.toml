[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperfit-recovery"
version = "0.1.0"
description = "Joint stress-volume hyperelastic calibration and open finite-element verification"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "felupe==10.1.0", "tensortrax>=0.26,<0.27", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["hyperfit*"]

[tool.setuptools.package-data]
hyperfit = ["frontend/*.html", "frontend/*.css", "frontend/*.js", "frontend/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
